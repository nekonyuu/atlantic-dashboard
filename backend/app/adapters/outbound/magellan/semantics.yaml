# Correspondance Magellan -> domaine (PLAN.md §3.4), établie sur le dump de la phase 0.
#
# Un équipement est reconnu par son `productId` (stable ; `customName` est
# modifiable par l'utilisateur). S'il y en a plusieurs du même productId, ils
# sont numérotés par deviceId croissant : `id` reçoit alors le suffixe _1, _2...
# (sauf si `single: true`).
#
# Chaque métrique : `capability` (capabilityId Magellan). Type, unité et libellés
# d'enum viennent du catalogue fournisseur ; `unit` ici ne sert qu'à corriger le
# catalogue quand il est faux. `cumulative: true` = compteur cumulé (deltas).

equipment:
  - id: heat_pump
    kind: heat_pump
    label: Pompe à chaleur
    product_id: 54          # interface CESA V2
    single: true
    metrics:
      outdoor_temperature: {capability: 119}
      generator_status: {capability: 91}
      circulator_flow: {capability: 112}
      # Catalogue : kWh avec résolution 0,001 ; valeurs observées (102040 en ~100 j)
      # incompatibles avec des kWh -> Wh. À confirmer face aux consommations journalières.
      energy_heating_cumulative: {capability: 57, unit: Wh, cumulative: true}
      energy_dhw_cumulative: {capability: 59, unit: Wh, cumulative: true}
      error_code: {capability: 180}
      active_errors: {capability: 182}
      emergency_mode: {capability: 21}
      wifi_rssi: {capability: 179}

  - id: generator
    kind: generator
    label: Générateur
    product_id: 58
    single: true
    metrics:
      flow_temperature: {capability: 109}
      return_temperature: {capability: 116}
      water_pressure: {capability: 100}
      modulation: {capability: 50}
      generator_errors: {capability: 6}

  - id: dhw
    kind: dhw
    label: Ballon ECS
    product_id: 47
    single: true
    metrics:
      dhw_temperature: {capability: 111}
      dhw_setpoint: {capability: 22}
      dhw_status: {capability: 99}
      dhw_on: {capability: 86}
      dhw_boost: {capability: 165}
      dhw_charge_setpoint: {capability: 105906}

  - id: circuit
    kind: circuit
    label: Circuit de chauffage
    product_id: 55
    metrics:
      flow_setpoint: {capability: 19}

  - id: room
    kind: room
    label: Pièce
    product_id: 26
    metrics:
      room_temperature: {capability: 117}
      room_setpoint: {capability: 17}
      thermostat_mode: {capability: 181}
      setpoint_mode: {capability: 184}
      heating_ongoing: {capability: 153}
